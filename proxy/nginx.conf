user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout  65;

    # ✅ 백엔드 컨테이너 (Spring Boot)
    upstream sweetspot_backend {
        server backend:8080;
    }

    # ✅ 프론트엔드 컨테이너 (React Web build)
    upstream sweetspot_frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # ✅ /oauth2/, /login/oauth2/ 요청은 백엔드로 전달
        location ~* ^/(oauth2|login/oauth2)/ {
            proxy_pass http://sweetspot_backend;
            # [수정] $http_host로 변경하여 포트 번호를 포함한 전체 호스트 주소를 전달합니다.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ /api/ 요청도 백엔드로 전달
        location /api/ {
            proxy_pass http://sweetspot_backend;
            # [수정] $http_host로 변경
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ✅ 그 외 모든 요청은 프론트엔드 컨테이너로 전달
        location / {
            proxy_pass http://sweetspot_frontend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
