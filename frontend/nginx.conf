# 이 파일은 frontend 폴더 안에 새로 만들어야 합니다.
server {
    listen 80;
    server_name localhost;

    # 웹사이트 파일이 위치한 기본 경로
    root /usr/share/nginx/html;
    # 기본으로 보여줄 파일
    index index.html;

    # 모든 요청을 처리하는 규칙
    location / {
        # 1. 요청된 파일($uri)을 찾는다.
        # 2. 없으면 디렉토리($uri/)를 찾는다.
        # 3. 그것도 없으면 /index.html 을 반환한다. (SPA 라우팅의 핵심)
        try_files $uri $uri/ /index.html;
    }
}
