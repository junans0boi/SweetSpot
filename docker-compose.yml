services:
  # =================================================================
  #  BACKEND SERVICES
  # =================================================================
  # 3. 사용자용 API 서버 (Backend)
  api-server:
    build:
      context: .
      dockerfile: sweetspot-api/Dockerfile
    container_name: sweetspot-api
    restart: always
    ports:
      - "5005:5005"
    environment:
      SPRING_PROFILES_ACTIVE: server
    env_file: ./.env
    networks:
      - sweetspot-network

  # 4. 관리자용 Admin 서버 (Backend)
  admin-server:
    build:
      context: .
      dockerfile: sweetspot-admin/Dockerfile
    container_name: sweetspot-admin
    restart: always
    ports:
      - "5007:5007"
    environment:
      SPRING_PROFILES_ACTIVE: server
    env_file: ./.env
    volumes:
      - ./output:/app/output
      - ./csv-data:/app/csv-data
      - ./logs:/app/logs
    networks:
      - sweetspot-network

  # =================================================================
  #  FRONTEND SERVICES
  # =================================================================
  # 5. 관리자용 Frontend (React)
  admin-client:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: sweetspot-admin-client
    restart: always
    ports:
      - "5008:5008"
    environment:
      - VITE_API_BASE_URL=https://admin.sweetspot.kro.kr/api/admin
    networks:
      - sweetspot-network

networks:
  sweetspot-network:
    driver: bridge