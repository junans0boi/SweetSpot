plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

// 1. 모든 프로젝트(루트 + 하위 모듈) 공통 설정
allprojects {
    group = 'com.hollywood'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// 2. 하위 모듈(core, api, admin) 공통 설정
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21) // Java 21 사용
        }
    }

    dependencies {
        // 롬복 (모든 모듈 필수)
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        
        // 테스트 (모든 모듈 필수)
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.security:spring-security-test'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// 3. Core 모듈 특수 설정 (실행 가능한 Jar가 아님)
project(':sweetspot-core') {
    bootJar {
        enabled = false // 실행 파일(jar) 생성 안 함
    }
    jar {
        enabled = true // 일반 라이브러리(jar) 생성 함
    }
}