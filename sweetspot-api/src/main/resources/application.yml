spring:
  config:
    import: optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # 공통 ddl-auto 설정은 유지합니다.
    properties:
      hibernate:
        default_batch_fetch_size: 100

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD} # Google 앱 비밀번호
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  google:
    places:
      api:
        key: ${GOOGLE_PLACES_API_KEY}


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

# JWT 설정
jwt:
  secret: ${JWT_SECRET}

server:
  port: 5005
